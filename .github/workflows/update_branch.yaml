---
name: Update pull request branch by pull request comment
on: issue_comment
jobs:
  update_branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    if: github.event.issue.pull_request && contains(fromJSON('["/update-branch", "/ub"]'), github.event.comment.body)
    steps:
      - uses: csm-actions/update-branch-action@9b6108a09188c55f18054cbfa05cfdabcf648602 # v1.2.0
        with:
          app_id: ${{vars.DEMO_CLIENT_APP_ID}}
          app_private_key: ${{secrets.DEMO_CLIENT_PRIVATE_KEY}}
          # Run the server workflow by workflow_dispatch instead of creating a label
          server_workflow_ref: csm-actions/demo-server/.github/workflows/update_branch_dispatch.yaml@main
