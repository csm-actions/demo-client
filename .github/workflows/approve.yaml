---
name: Approve pull requests
run-name: Approve pull requests (${{github.event.issue.number}})
on: issue_comment
jobs:
  approve:
    name: Approve a pull request (${{github.event.issue.number}})
    runs-on: ubuntu-24.04
    if: github.event.issue.pull_request && github.event.comment.body == '/approve'
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: csm-actions/approve-pr-action@000639bc62037626041db99bfc464fe7dee2f5c6 # v1.1.0
        with:
          pull_request_number: ${{ github.event.issue.number }}
          app_id: ${{vars.DEMO_CLIENT_APP_ID}}
          app_private_key: ${{secrets.DEMO_CLIENT_PRIVATE_KEY}}
          # Run the server workflow by workflow_dispatch instead of creating a label
          server_workflow_ref: csm-actions/demo-server/.github/workflows/approve_dispatch.yaml@main
