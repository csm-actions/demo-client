---
name: securefix
# on: push
on: pull_request
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm i -g prettier
      - run: prettier -w .

      - uses: csm-actions/securefix-action@75f446c03c22cc2cfc1c944577dfd0dac5111738 # v0.7.0
        with:
          action: client
          app_id: ${{vars.DEMO_CLIENT_APP_ID}}
          app_private_key: ${{secrets.DEMO_CLIENT_PRIVATE_KEY}}
          # Run the server workflow by workflow_dispatch.
          # Managing it with an organization variable lets you change it without fixing workflows.
          server_workflow_ref: csm-actions/demo-server/.github/workflows/securefix_dispatch.yaml@main
