---
name: securefix
# on: push
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm i -g prettier
      - run: prettier -w .

      - uses: csm-actions/securefix-action@pr/896
        id: securefix
        with:
          action: client
          app_id: ${{vars.DEMO_CLIENT_APP_ID}}
          app_private_key: ${{secrets.DEMO_CLIENT_PRIVATE_KEY}}
          # Run the server workflow by workflow_dispatch instead of creating a label
          server_workflow_ref: csm-actions/demo-server/.github/workflows/securefix_dispatch.yaml@main
      - if: always() && steps.securefix.outputs.server_workflow_run_url != ''
        run: echo "::notice::server workflow run: $SERVER_WORKFLOW_RUN_URL"
        env:
          SERVER_WORKFLOW_RUN_URL: ${{ steps.securefix.outputs.server_workflow_run_url }}
